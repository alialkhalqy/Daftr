name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          convert icon-512.png -resize 1024x1024 assets/icon-only.png
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "دفتر مذكراتي" com.alikhalqy.diary --web-dir www
          npx cap add android
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#8b5e3c' --iconBackgroundColorDark '#8b5e3c'
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../diary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: diary-apk
          path: diary.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Diary APK ${{ github.run_number }}
          files: diary.apk
